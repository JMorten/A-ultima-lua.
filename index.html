<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Última Lua">
<title>A Última Lua VS 1.17.1 — Marcos e Caçada do Pântano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/game.css">
</head>
<body>
<noscript><div style="position:fixed;inset:0;z-index:99999;background:#0a090d;color:#ddd4c0;padding:32px 22px;font:17px/1.5 Georgia,serif;text-align:center;display:flex;align-items:center;justify-content:center;"><div style="max-width:520px;border:1px solid #3a2b38;background:#161219;padding:24px;"><h2 style="margin:0 0 10px;font-family:Georgia,serif;">Última Lua</h2><p style="margin:0 0 10px;">O jogo precisa ser aberto em um navegador com JavaScript ativado.</p><p style="margin:0;color:#948a78;font-size:14px;">Se você estiver vendo esta mensagem no visualizador de arquivos do iPhone, abra o arquivo no Safari ou em um servidor web local. O visualizador de arquivos pode mostrar o HTML sem executar o jogo.</p></div></div></noscript>

<!-- ===================== TITLE / CLASS SELECT ===================== -->
<div id="title-screen">
  <div class="moon-glyph"></div>
  <div class="title-eyebrow">UM RPG DE TURNOS</div>
  <h1>Última Lua</h1>
  <p class="title-sub">Quatro territórios amaldiçoados. Lobos, trolls, orcs e os vampiros que governam a noite. Escolha quem você será antes de entrar na escuridão.</p>
  <div class="class-select" id="class-select"></div>
</div>

<!-- ===================== MAIN GAME SCREEN ===================== -->
<div id="game-screen" class="hidden">
  <div id="hud">
    <div class="hud-name">Nível <span id="hud-level">1</span> · <span id="hud-classname">—</span></div>
    <div class="hud-bars">
      <div class="bar-row">HP <div class="bar-track"><div class="bar-fill hp" id="hud-hp-fill"></div></div><span id="hud-hp-text">0/0</span></div>
      <div class="bar-row">MP <div class="bar-track"><div class="bar-fill mp" id="hud-mp-fill"></div></div><span id="hud-mp-text">0/0</span></div>
      <div class="bar-row">XP <div class="bar-track"><div class="bar-fill xp" id="hud-xp-fill"></div></div><span id="hud-xp-text">0/0</span></div>
    </div>
    <div class="hud-coins">🪙 <span id="hud-coins">0</span></div>
  </div>
  <div id="event-bar">
    <span id="event-monster-chip" class="event-chip">🧟 Onda: --</span>
    <span id="event-xp-chip" class="event-chip">🌕 Bênção: --</span>
    <span id="event-tonic-chip" class="event-chip hidden">📜 Tônico: --</span>
  </div>
  <div id="tabs">
    <button class="tab-btn" data-tab="mapa">Mapa</button>
    <button class="tab-btn" data-tab="batalha">Batalha</button>
    <button class="tab-btn" data-tab="inventario">Inventário<span class="tab-badge hidden" id="badge-inventario"></span></button>
    <button class="tab-btn" data-tab="loja">Mercador</button>
    <button class="tab-btn" data-tab="status">Status<span class="tab-badge hidden" id="badge-status"></span></button>
  </div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>
<div id="notif-layer"></div>

<script src="src/game.js"></script>
<script src="src/persistence.js"></script>
</body>
</html>
