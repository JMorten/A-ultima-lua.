name: CI

on:
  push:
    branches: [main, qa-preview, "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # O teste de baseline Romar usa `git show bff8a72`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testes Node
        run: node --test tests/*.test.cjs
      - name: Sintaxe JS
        run: |
          node --check src/game.js
          node --check src/persistence.js
          node --check src/combat-animator.js
          node --check src/gorthak-visual.js
          node --check _qa/build.cjs
          node --check _qa/debug.js

  browser-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Playwright do projeto
        working-directory: tests/browser
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Instalar Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Rodar Chromium
        working-directory: tests/browser
        run: node run.cjs chromium
      - name: Guardar artefatos Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: tests/browser/artifacts
          if-no-files-found: ignore

  browser-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Playwright do projeto
        working-directory: tests/browser
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Instalar WebKit
        working-directory: tests/browser
        run: npx playwright install --with-deps webkit
      - name: Rodar WebKit
        working-directory: tests/browser
        run: node run.cjs webkit
      - name: Guardar artefatos WebKit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit
          path: tests/browser/artifacts
          if-no-files-found: ignore

  assets-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Nesta branch os assets ainda são PNG/JPG.
      # A branch chore/assets-webp troca para 600 KB / 15 MB.
      - name: Verificar orçamento de assets
        run: node tools/check-assets.mjs assets 3200 57
